[project]
name = "lianhua-guangma-backend"
version = "0.1.0"
description = "莲花广麻 · 联网麻将后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "websockets>=13.0",
    # 运行时实际依赖（此前仅装进 venv，未声明，导致新环境/Docker 安装缺库）
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    # LLM / 火山与百度 TTS 的异步 HTTP 客户端（生产运行时必需）。
    "httpx>=0.27.0",
    # TTS provider、音色、缓存和降级策略统一从 YAML 加载。
    "PyYAML>=6.0.2",
    # 日志：统一 loguru 输出（拦截 stdlib logging，见 app/logging_config.py）
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# 支持 `pip install .`（Dockerfile 依赖）：构建 wheel 后 app 打进 site-packages。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["storage/*.sql"]
