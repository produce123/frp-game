name: Protect crates

# Run the trusted workflow, never check out or execute PR code.
# Enable this on the default branch, then require "protect-crates" in the
# target branch's protection rules. Do not add path filters to this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  pull-requests: read

jobs:
  protect-crates:
    name: protect-crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject changes under crates/
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          number = int(event["number"])
          repository = os.environ["GITHUB_REPOSITORY"]
          endpoint = f"{os.environ['GITHUB_API_URL']}/repos/{repository}/pulls/{number}"

          def get(url):
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def fail(message):
              raise SystemExit(message)

          def revision(pr):
              return (pr["head"]["sha"], pr["base"]["sha"], pr["base"]["ref"])

          pr = get(endpoint)
          if pr["head"]["sha"] != event["pull_request"]["head"]["sha"]:
              fail("PR 已更新，请查看最新提交的检查结果。")
          expected = pr["changed_files"]
          # GitHub's files endpoint returns at most 3,000 files.
          if expected > 3000:
              fail("PR 超过 3000 个改动文件，无法完整检查，请拆分 PR。")

          files = []
          for page in range(1, (expected + 99) // 100 + 1):
              files.extend(get(f"{endpoint}/files?per_page=100&page={page}"))
          if len(files) != expected or len({f["filename"] for f in files}) != expected:
              fail("未获取到完整且唯一的文件列表，检查失败，请重新运行。")
          latest = get(endpoint)
          if revision(latest) != revision(pr) or latest["changed_files"] != expected:
              fail("检查期间 PR 或目标分支发生变化，请重新运行检查。")

          def protected(path):
              return path == "crates" or path.startswith("crates/")

          blocked = [f for f in files if any(
              protected(path)
              for path in (f["filename"], f.get("previous_filename", ""))
          )]
          if blocked:
              print("此 PR 不允许改动 crates/，请撤销以下文件的改动：", flush=True)
              for file in blocked:
                  # JSON escaping keeps filenames from injecting log commands.
                  print(json.dumps({key: file[key] for key in
                      ("status", "filename", "previous_filename") if key in file},
                      ensure_ascii=True), flush=True)
              fail(f"检查失败：发现 {len(blocked)} 个受保护文件改动。")
          print(f"检查通过：已检查 {len(files)} 个文件，未改动 crates/。")
          PY
