[package]
name = "ai-town-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
publish = false

[[bin]]
name = "AITown"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
serde_json = "1"
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }
# 下面三个和 wry 用的是同一版：页面的确认框（window.rs 的 watch_dialogs）要直接调 WebView2
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# 独立于仓库根目录的工作区：只在打 Windows 包时编，不进 CI 的 cargo build --workspace
[workspace]
